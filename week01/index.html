
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Verify Page</title>
    <style>
/* ====== 把你的这段CSS粘贴在这里 ====== */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: system-ui, sans-serif;
}
body {
    background-color: #000000;
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.verify-card {
    width: 100%;
    max-width: 750px;
    text-align: center;
}
h2 {
    font-weight: normal;
    font-size: 2.3rem;
    line-height: 1.3;
    margin-bottom: 12px;
    color: #cbd5e1;
}
.tip-text {
    font-size: 2.1rem;
    color: #94a3b8;
    margin-bottom: 32px;
}
.phone-input-wrap {
    display: flex;
    border: 1px solid #333;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 20px;
}
#countrySelect {
    background-color: #111;
    color: white;
    border: none;
    padding: 18px 14px;
    font-size: 1.5rem;
    outline: none;
}
#phoneInput {
    flex:1;
    background-color: #111;
    color: #fff;
    border: none;
    padding: 18px 20px;
    font-size: 1.5rem;
    outline: none;
}
.error-text {
    color: #ff5555;
    font-size: 2rem;
    text-align: left;
    margin:16px 0;
    line-height: 1.4;
}
.hidden {
    display: none !important;
}
#sendCodeBtn {
    width:100%;
    padding:16px;
    margin-top: 12px;
    background-color: #2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:1.3rem;
    cursor: pointer;
}
#sendCodeBtn:disabled{
    background-color:#334155;
    cursor:not-allowed;
}
.code-wrap {
    display:flex;
    gap:10px;
    margin-top:16px;
}
#codeInput{
    flex:1;
    padding:16px;
    background:#111;
    border:1px solid #333;
    color:#fff;
    border-radius:10px;
    font-size:1.3rem;
}
#submitBtn{
    padding:16px 24px;
    background:#10b981;
    color:white;
    border:none;
    border-radius:10px;
    font-size:1.3rem;
    cursor:pointer;
}
.bottom-note {
    margin-top:30px;
    font-size:1.8rem;
    color:#94a3b8;
}
    </style>
</head>
<body>
<!-- 你的HTML页面结构 -->
<div class="container">
    <div class="verify-card">
        <h2>Please enter your phone number to verify your login.</h2>
        <p class="tip-text">You will receive a single use code to submit.</p>
        <div class="phone-input-wrap">
            <select id="countrySelect">
                <option value="+86">🇨🇳 +86</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
            </select>
            <input type="tel" id="phoneInput" placeholder="190 3257 1692">
        </div>
        <div id="errorMsg" class="error-text hidden">
            The verification phone number has been temporarily blocked. Please wait 12 hours and try again.
        </div>
        <div class="code-wrap hidden" id="codeArea">
            <input type="text" id="codeInput" placeholder="Enter verification code">
            <button id="submitBtn">Submit</button>
        </div>
        <button id="sendCodeBtn">Send Verification Code</button>
        <p class="bottom-note">We won’t ever message you — other than for verification</p>
    </div>
</div>

<script>
// JS代码放在这里
const sendCodeBtn = document.getElementById('sendCodeBtn');
const phoneInput = document.getElementById('phoneInput');
const countrySelect = document.getElementById('countrySelect');
const errorMsg = document.getElementById('errorMsg');
const codeArea = document.getElementById('codeArea');
const codeInput = document.getElementById('codeInput');
const submitBtn = document.getElementById('submitBtn');
const blockedPhone = "19032571692";

sendCodeBtn.addEventListener('click', ()=>{
    const phone = phoneInput.value.replace(/\s/g,'');
    if(!phone){
        alert("请输入手机号");
        return;
    }
    if(phone === blockedPhone){
        errorMsg.classList.remove('hidden');
        codeArea.classList.add('hidden');
        return;
    }
    errorMsg.classList.add('hidden');
    codeArea.classList.remove('hidden');
    sendCodeBtn.disabled = true;
    let count = 60;
    let timer = setInterval(()=>{
        sendCodeBtn.innerText = `Resend(${count}s)`;
        count--;
        if(count <=0){
            clearInterval(timer);
            sendCodeBtn.innerText = "Send Verification Code";
            sendCodeBtn.disabled = false;
        }
    },1000);
});

submitBtn.addEventListener('click',()=>{
    const code = codeInput.value;
    if(code.length === 6){
        alert("验证成功！");
    }else{
        alert("请输入6位验证码");
    }
})
</script>
</body>
</html>
